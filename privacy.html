        function changeLang(lang) {
            localStorage.setItem('histur_lang', lang);
            const t = content[lang];
            
            // Navbar
            document.getElementById('nav-cta').innerText = t.navCta;
            document.getElementById('current-lang-flag').src = flags[lang];
            document.getElementById('current-lang-flag').alt = lang.toUpperCase();

            // Policy Content
            document.getElementById('policy-title').innerText = t.title;
            document.getElementById('last-updated').innerText = t.updated;
            
            const container = document.getElementById('policy-content');
            container.innerHTML = `<p class="font-medium">${t.intro}</p>`;
            
            t.sections.forEach(sec => {
                const sectionHtml = `
                    <div class="mt-8">
                        <h2 class="text-xl font-bold text-slate-900 mb-3 serif">${sec.t}</h2>
                        <p class="text-slate-700">${sec.c}</p>
                    </div>
                `;
                container.innerHTML += sectionHtml;
            });

            // Footer
            document.getElementById('footer-privacy').innerText = t.footerPrivacy;
            document.getElementById('footer-contact').innerText = t.footerContact;
            document.getElementById('footer-text').innerText = t.footerText;
        }

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            const savedLang = localStorage.getItem('histur_lang') || 'es';
            changeLang(savedLang);
        });
